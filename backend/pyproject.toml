[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-companion-agent"
version = "1.0.0"
description = "A local-first personal companion agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "keyring>=25,<27",
  "jieba>=0.42,<1",
]

[tool.setuptools]
packages = ["companion", "companion.providers"]
